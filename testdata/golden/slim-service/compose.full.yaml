# Uso: docker compose -f compose.yaml -f compose.full.yaml up --build
services:
  app:
    build: .
    image: slim-service:local
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
