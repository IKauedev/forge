# Uso: docker compose -f compose.yaml -f compose.full.yaml up --build
services:
  app:
    build: .
    image: payments-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-payments_api}
      DB_USERNAME: ${DB_USER:-payments_api}
      DB_PASSWORD: ${DB_PASSWORD:-payments_api}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://issuer.example.invalid}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
