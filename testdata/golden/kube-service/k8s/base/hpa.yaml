apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kube-service
  labels:
    app.kubernetes.io/name: kube-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kube-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
