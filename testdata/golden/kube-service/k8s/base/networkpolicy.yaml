apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-service
  labels:
    app.kubernetes.io/name: kube-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Só o ingress controller (namespace ingress-nginx) fala com a aplicação.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS externo (ViaCEP, JWKS do emissor OIDC)
    - ports:
        - port: 443
          protocol: TCP
    # Banco de dados. Restrinja o destino com "to: ipBlock" (CIDR das subnets do banco) se quiser.
    - ports:
        - port: 3306
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
