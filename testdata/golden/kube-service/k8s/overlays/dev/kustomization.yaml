apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente dev: pouco capacity, 1 a 2 réplicas. Deploy automático a cada push na main.
namespace: kube-service-dev

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: kube-service-dev
      environment: dev

configMapGenerator:
  - name: kube-service
    behavior: merge
    literals:
      - DB_HOST=kube-service-dev.db.example.internal
      - JWT_ISSUER_URI=https://issuer.dev.example.invalid
      - REDIS_HOST=kube-service-dev.cache.example.internal

patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: kube-service
      spec:
        minReplicas: 1
        maxReplicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kube-service
      spec:
        template:
          spec:
            containers:
              - name: kube-service
                resources:
                  requests:
                    cpu: 100m
                    memory: 384Mi
                  limits:
                    memory: 640Mi
  - target:
      kind: Ingress
      name: kube-service
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kube-service.dev.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: kube-service.dev.example.com
