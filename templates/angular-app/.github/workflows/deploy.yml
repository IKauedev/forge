name: Deploy

# Push na main: valida e constrói o site uma vez, publica em dev e, depois da aprovação do
# Environment "prod", publica o MESMO build em produção (o config.json é gerado por ambiente).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/starter-app/browser
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy dev
    needs: build
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev

  deploy-prod:
    name: Deploy prod
    needs: [build, deploy-dev]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod # exige aprovação: Required reviewers no Environment "prod"
