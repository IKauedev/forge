apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente hml (homologação): espelha a produção em tamanho menor. Deploy depois do dev.
namespace: starter-app-hml

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: starter-app-hml
      environment: hml

configMapGenerator:
  - name: starter-app
    behavior: merge
    literals:
      - API_BASE_URL=https://api.hml.example.com

patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: starter-app
      spec:
        minReplicas: 2
        maxReplicas: 3
  - target:
      kind: Ingress
      name: starter-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: starter-app.hml.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: starter-app.hml.example.com
