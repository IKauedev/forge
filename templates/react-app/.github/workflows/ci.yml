name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  # forge:if k8s=kustomize

  k8s-manifests:
    name: Manifests Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Falha se algum overlay deixar de renderizar (patch quebrado, recurso faltando, YAML inválido).
      - name: Renderizar os overlays
        run: |
          for env in dev hml prd; do
            echo "::group::${env}"
            kubectl kustomize "k8s/overlays/${env}" > /dev/null
            echo "::endgroup::"
          done
  # forge:end
