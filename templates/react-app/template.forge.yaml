# Manifesto do template. Lido pelo forge; nunca é copiado para o projeto gerado.
name: react-app
description: App React (Vite + TypeScript) com config em runtime, guards por role, S3 + CloudFront (OAC) e pipeline OIDC

# Nome kebab de referência. As outras formas (StarterApp, starter_app, STARTER_APP, Starter App,
# starterapp) são derivadas dele e trocadas pelas do projeto gerado.
sentinel: starter-app

options:
  - name: k8s
    description: Manifests Kubernetes (Kustomize) para dev, hml e prd, com pipeline de deploy (none = não gera)
    values: [none, kustomize]
    default: none

reference:
  k8s: kustomize

next_steps:
  - npm ci
  - npm start # http://localhost:4200
  - npm test

remove:
  - when: k8s=none
    paths:
      - k8s/
      - docs/KUBERNETES.md
      - .github/workflows/deploy-k8s.yml
      - .github/workflows/deploy-k8s-env.yml
