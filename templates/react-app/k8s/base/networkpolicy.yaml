apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starter-app
  labels:
    app.kubernetes.io/name: starter-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starter-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Só o ingress controller (namespace ingress-nginx) fala com a aplicação.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # O nginx só serve arquivos estáticos: não precisa de mais nenhuma saída além do DNS.
