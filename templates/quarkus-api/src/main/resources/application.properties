quarkus.application.name=starter-api
quarkus.shutdown.timeout=30S
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{correlationId}] %c{2.} - %s%e%n
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.smallrye-openapi.enable=false

# Health: /q/health/live e /q/health/ready (usado pelo ALB e pelo healthcheck do container)

# forge:if db!=none
# forge:slot qk-db-config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
# forge:end
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
# Em dev e nos testes o Dev Services sobe o banco (Docker); em produção a conexão vem do ambiente.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# forge:end
# forge:if auth!=none
# Endpoints sem @Authenticated, @RolesAllowed ou @PermitAll respondem 403: seguro por padrão.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Claim do JWT com as roles (ex.: cognito:groups)
smallrye.jwt.path.groups=${JWT_ROLES_CLAIM:roles}
mp.jwt.verify.issuer=starter-api-dev
%prod.mp.jwt.verify.issuer=${JWT_ISSUER_URI}
%prod.mp.jwt.verify.publickey.location=${JWT_JWKS_URI:${JWT_ISSUER_URI}/.well-known/jwks.json}

# Somente dev e test: tokens HS256 assinados com um segredo de desenvolvimento (POST /dev/token).
# Nunca use fora desses perfis; em produção a verificação usa o JWKS do emissor.
app.security.dev-secret=local-dev-only-secret-change-me-0123456789
%dev.smallrye.jwt.verify.algorithm=HS256
%dev.mp.jwt.verify.publickey={"kty":"oct","alg":"HS256","k":"bG9jYWwtZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5"}
%test.smallrye.jwt.verify.algorithm=HS256
%test.mp.jwt.verify.publickey={"kty":"oct","alg":"HS256","k":"bG9jYWwtZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5"}

# forge:end
quarkus.rest-client.viacep.url=https://viacep.com.br/ws
quarkus.rest-client.viacep.connect-timeout=2000
quarkus.rest-client.viacep.read-timeout=3000
# Nos testes: retry rápido e circuito que não abre
%test.com.example.starterapi.adapter.out.client.ViaCepAdapter/findByCep/Retry/delay=10
%test.com.example.starterapi.adapter.out.client.ViaCepAdapter/findByCep/CircuitBreaker/requestVolumeThreshold=1000
