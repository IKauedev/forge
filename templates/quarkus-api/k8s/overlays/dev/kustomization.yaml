apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente dev: pouco capacity, 1 a 2 réplicas. Deploy automático a cada push na main.
namespace: starter-api-dev

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: starter-api-dev
      environment: dev

configMapGenerator:
  - name: starter-api
    behavior: merge
    literals:
      # forge:if db!=none
      - DB_HOST=starter-api-dev.db.example.internal
      # forge:end
      # forge:if auth!=none
      - JWT_ISSUER_URI=https://issuer.dev.example.invalid
      # forge:end

patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: starter-api
      spec:
        minReplicas: 1
        maxReplicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: starter-api
      spec:
        template:
          spec:
            containers:
              - name: starter-api
                resources:
                  requests:
                    cpu: 100m
                    memory: 384Mi
                  limits:
                    memory: 640Mi
  - target:
      kind: Ingress
      name: starter-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: starter-api.dev.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: starter-api.dev.example.com
