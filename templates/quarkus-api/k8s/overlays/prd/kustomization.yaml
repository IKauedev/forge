apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente prd (produção): mais réplicas e recursos. O deploy espera a aprovação do Environment "prd".
namespace: starter-api-prd

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: starter-api-prd
      environment: prd

configMapGenerator:
  - name: starter-api
    behavior: merge
    literals:
      # forge:if db!=none
      - DB_HOST=starter-api-prd.db.example.internal
      # forge:end
      # forge:if auth!=none
      - JWT_ISSUER_URI=https://issuer.example.invalid
      # forge:end

patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: starter-api
      spec:
        minReplicas: 3
        maxReplicas: 10
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: starter-api
      spec:
        template:
          spec:
            containers:
              - name: starter-api
                resources:
                  requests:
                    cpu: 500m
                    memory: 768Mi
                  limits:
                    memory: 1Gi
  # O host de produção é o da base (starter-api.example.com); troque pelo seu domínio em base/ingress.yaml.
