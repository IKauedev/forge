# Manifesto do template. Lido pelo forge; nunca é copiado para o projeto gerado.
#
# O template COMPILA sozinho no estado de "reference". Variações usam diretivas em comentários
# (forge:if / forge:else / forge:end) e ramos alternativos comentados com "~" (//~, #~, <!--~ -->).
name: spring-api
description: API Spring Boot hexagonal com Java 25, Flyway, Testcontainers e ArchUnit

sentinel: starter-api
java_package: true

next_steps:
  - ./mvnw verify    # requer JDK 25 e Docker (Testcontainers)
  - forge doctor     # confere o ambiente

options:
  - name: db
    description: Banco de dados (valores do catálogo; none = sem persistência)
    values: [none]
    extend_with_catalog: true
    default: postgres
  - name: vpc
    description: Rede da infra Terraform (new = cria a VPC; existing = usa uma VPC que você já tem)
    values: [new, existing]
    default: new
  - name: http
    description: Cliente HTTP do módulo de exemplo (ViaCEP)
    values: [feign, webclient, both]
    default: both
  - name: auth
    description: Autenticação (jwt = resource server; cognito = jwt ajustado ao Amazon Cognito)
    values: [none, jwt, cognito]
    default: jwt
  - name: cache
    description: Cache da consulta de CEP
    values: [none, caffeine, redis]
    default: none
  - name: k8s
    description: Manifests Kubernetes (Kustomize) para dev, hml e prd, com pipeline de deploy (none = não gera)
    values: [none, kustomize]
    default: none

# Estado em que o template de referência compila e é testado sem passar pelo forge.
reference:
  db: postgres
  vpc: new
  http: both
  auth: jwt
  cache: caffeine
  k8s: kustomize

remove:
  - when: db=none
    paths:
      - src/main/java/com/example/starterapi/adapter/out/persistence/
      - src/test/java/com/example/starterapi/adapter/out/persistence/
      - src/main/resources/db/
  - when: db=none && cache!=redis
    paths:
      - compose.yaml
      - src/test/java/com/example/starterapi/TestcontainersConfig.java
  - when: db!=none
    paths:
      - src/main/java/com/example/starterapi/config/NoOpAddressRepository.java
  - when: db=none
    paths:
      - infra/modules/database/
  - when: vpc=existing
    paths:
      - infra/modules/network/
  - when: http=feign
    paths:
      - src/main/java/com/example/starterapi/adapter/out/client/ViaCepWebClientAdapter.java
      - src/test/java/com/example/starterapi/adapter/out/client/ViaCepWebClientTest.java
  - when: http=webclient
    paths:
      - src/main/java/com/example/starterapi/adapter/out/client/ViaCepFeignAdapter.java
      - src/main/java/com/example/starterapi/adapter/out/client/ViaCepFeignClient.java
      - src/main/java/com/example/starterapi/adapter/out/client/CorrelationIdFeignInterceptor.java
      - src/test/java/com/example/starterapi/adapter/out/client/ViaCepFeignClientTest.java
  - when: auth=none
    paths:
      - src/main/java/com/example/starterapi/shared/security/
      - src/main/java/com/example/starterapi/config/SecurityConfig.java
      - src/main/java/com/example/starterapi/config/MethodSecurityConfig.java
      - src/main/java/com/example/starterapi/config/ProblemDetailSecurityHandler.java
      - src/main/java/com/example/starterapi/config/DevJwtConfig.java
      - src/main/java/com/example/starterapi/config/OpenApiConfig.java
      - src/main/java/com/example/starterapi/adapter/in/web/MeController.java
      - src/main/java/com/example/starterapi/adapter/in/web/AdminController.java
      - src/main/java/com/example/starterapi/adapter/in/web/DevTokenController.java
      - src/test/java/com/example/starterapi/shared/security/
      - src/test/java/com/example/starterapi/adapter/in/web/SecurityEndpointsTest.java
      - src/test/java/com/example/starterapi/adapter/in/web/DevTokenControllerTest.java
  - when: cache=none
    paths:
      - src/main/java/com/example/starterapi/config/CacheConfig.java
  - when: k8s=none
    paths:
      - k8s/
      - docs/KUBERNETES.md
      - .github/workflows/deploy-k8s.yml
      - .github/workflows/deploy-k8s-env.yml
