spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
