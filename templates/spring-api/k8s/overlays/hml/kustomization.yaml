apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente hml (homologação): espelha a produção em tamanho menor. Deploy depois do dev.
namespace: starter-api-hml

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: starter-api-hml
      environment: hml

configMapGenerator:
  - name: starter-api
    behavior: merge
    literals:
      # forge:if db!=none
      - DB_HOST=starter-api-hml.db.example.internal
      # forge:end
      # forge:if auth!=none
      - JWT_ISSUER_URI=https://issuer.hml.example.invalid
      # forge:end
      # forge:if cache=redis
      #~ - REDIS_HOST=starter-api-hml.cache.example.internal
      # forge:end

patches:
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: starter-api
      spec:
        minReplicas: 2
        maxReplicas: 3
  - target:
      kind: Ingress
      name: starter-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: starter-api.hml.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: starter-api.hml.example.com
