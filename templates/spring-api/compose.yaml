# Somente infraestrutura. A aplicação roda no host (make run) ou via compose.full.yaml.
name: starter-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starter_api}
      POSTGRES_USER: ${POSTGRES_USER:-starter_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter_api}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
