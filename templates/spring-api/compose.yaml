# Somente infraestrutura. A aplicação roda no host (make run) ou via compose.full.yaml.
name: starter-api

services:
  # forge:if db!=none
  # forge:slot db-compose-service
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-starter_api}
      POSTGRES_USER: ${DB_USER:-starter_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starter_api}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  # forge:end

  # forge:end
  # forge:if cache=redis
  #~ redis:
  #~   image: redis:8-alpine
  #~   ports:
  #~     - "${REDIS_PORT:-6379}:6379"
  #~   healthcheck:
  #~     test: ["CMD", "redis-cli", "ping"]
  #~     interval: 5s
  #~     timeout: 3s
  #~     retries: 10
  #~
  # forge:end
  # forge:if db!=none
  adminer:
    image: adminer:6
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  # forge:end
